[General]
DisableDefaultImports=false
MaxWarnings=0

[Warnings]
# app/network/power are intentionally injected service boundaries. QML's
# static analyzer cannot type context properties, so only this category is
# suppressed; missing types/properties/imports remain build-breaking.
ContextProperties=disable
UnqualifiedAccess=disable
UnusedImports=warning
ImportFailure=error
MissingProperty=error
MissingType=error
UnresolvedAlias=error
UnresolvedType=error
IncompatibleType=error
PropertyOverride=error
RequiredProperty=error
